# Codegen policy for calendar.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Own the hand-written Calendar SQL (the working-days read-port) that the query service
  # delegates to. Declared here — not renamed with a `_custom` suffix — so the generator skips it
  # wholesale; this declaration is what makes editing it legitimate (mirrors backbone-attendance's
  # repo ownership).
  - "src/infrastructure/persistence/calendar_repository.rs"
  # The public query-service trait gains a hand-written port method (`working_days`); owning the
  # file keeps that method across regen instead of living behind a CUSTOM marker outside the trait.
  - "src/exports/services.rs"
  # Hand-written `CalendarQueryService` impl (delegates standard lookups to GenericCrudService +
  # `working_days` to the repo). User-owned so the impl survives regen.
  - "src/application/service/calendar_query_service.rs"
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # Event family (meetings / recurrence / attendees) — hand-written behavior on top of the
  # generated CRUD surface. The series engine owns eager materialization, (start,stop)-identity
  # rewrites, and the exception ledger; the guarded-routes file is the ONLY HTTP surface the
  # event family mounts (schema-named paths, fail-closed permission guards). The three
  # event-family repos are hand-owned because they add RLS-scoped transaction work the
  # GenericCrudRepository newtype does not express.
  - "src/application/service/calendar_event_series_service_custom.rs"
  - "src/presentation/http/calendar_event_guarded_routes.rs"
  # Event-family permission policies, in the generated shape but hand-written:
  # the auth generator layer is opt-in (`layers: true`) and this module keeps it
  # off, so these vocabulary files are user-owned instead of regenerated.
  - "src/application/auth/calendar_event_auth.rs"
  - "src/application/auth/calendar_event_series_auth.rs"
  - "src/application/auth/calendar_event_exception_auth.rs"
  - "src/application/auth/calendar_event_attendee_auth.rs"
  - "src/infrastructure/persistence/calendar_event_repository.rs"
  - "src/infrastructure/persistence/calendar_event_exception_repository.rs"
  - "src/infrastructure/persistence/calendar_event_attendee_repository.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"
  - "tests/calendar_event_family_probes.rs"

  # Hand-authored module documentation.
  - "docs/**"
