server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/calendar.log
module:
  name: calendar
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  calendar:
    collection: calendars
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_branch:
    collection: calendar_branches
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_department:
    collection: calendar_departments
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_employee:
    collection: calendar_employees
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_employee_status:
    collection: calendar_employee_statuses
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_level:
    collection: calendar_levels
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_position:
    collection: calendar_positions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  calendar_religion:
    collection: calendar_religions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
