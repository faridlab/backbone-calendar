# =============================================================================
# Domain: calendar
# Entity: CalendarLevel
# Description: Calendar scope junction — level dimension. level_id is a
#              cross-module logical FK to organization.Level.id.
# =============================================================================

models:
  - name: CalendarLevel
    collection: calendar_levels
    description: "Calendar scope junction: level."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique id"

      calendar_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Calendar.id)"]
        description: "# FK calendars.id (in-module)"

      level_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK organization.Level.id"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [calendar_id]
