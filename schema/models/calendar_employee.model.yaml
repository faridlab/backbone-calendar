# =============================================================================
# Domain: calendar
# Entity: CalendarEmployee
# Description: Calendar scope junction — explicit-employee dimension.
#              employee_id is a cross-module logical FK to employee.Employee.id.
# =============================================================================

models:
  - name: CalendarEmployee
    collection: calendar_employees
    description: "Calendar scope junction: explicit employee."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique id"

      calendar_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Calendar.id)"]
        description: "# FK calendars.id (in-module)"

      employee_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK employee.Employee.id"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [calendar_id]
      - type: index
        fields: [employee_id]
