# =============================================================================
# Domain: calendar
# Entity: CalendarReligion
# Description: Calendar scope junction — religion dimension. religion_id is a
#              cross-module logical FK to employee.Religion.id.
# =============================================================================

models:
  - name: CalendarReligion
    collection: calendar_religions
    description: "Calendar scope junction: religion."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique id"

      calendar_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Calendar.id)"]
        description: "# FK calendars.id (in-module)"

      religion_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK employee.Religion.id"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [calendar_id]
