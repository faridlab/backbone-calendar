# =============================================================================
# Domain: calendar
# Entity: Calendar
# Description: A holiday or working-day window scoped to org dimensions.
#              Scope junctions (CalendarBranch/Religion/Department/Level/
#              Position/EmployeeStatus/Employee) express "which employees this
#              applies to".
# =============================================================================

models:
  - name: Calendar
    collection: calendars
    description: "A holiday or working-day window scoped to org dimensions."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique calendar id"

      name:
        type: string
        attributes: ["@required", "@length(max=120)"]
        description: "Calendar name"

      date_start:
        type: date
        attributes: ["@required"]
        description: "Window start (inclusive)"

      date_end:
        type: date
        attributes: ["@required"]
        description: "Window end (inclusive)"

      is_holiday:
        type: boolean
        attributes: ["@default(false)"]
        description: "true = holiday (non-working); false = special working day"

      can_everyone_view:
        type: boolean
        attributes: ["@default(true)"]
        description: "Visibility flag"

      note:
        type: string?
        attributes: ["@length(max=1000)"]
        description: "Free-form note"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The timeline scan
    # index and any per-unit uniques are installed by the composing service's tenancy
    # decorator, not declared here.
