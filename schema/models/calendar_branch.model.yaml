# =============================================================================
# Domain: calendar
# Entity: CalendarBranch
# Description: Calendar scope junction — branch dimension. (salt-laravel had no
#              branch_id; added here as a logical FK organization.Branch.id.)
# =============================================================================

models:
  - name: CalendarBranch
    collection: calendar_branches
    description: "Calendar scope junction: branch."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique id"

      calendar_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Calendar.id)"]
        description: "# FK calendars.id (in-module)"

      branch_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK organization.Branch.id"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [calendar_id]
