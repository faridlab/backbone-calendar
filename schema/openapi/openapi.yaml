components:
  schemas:
    Calendar:
      type: object
      required:
        - id
        - company_id
        - name
        - date_start
        - date_end
        - is_holiday
        - can_everyone_view
        - metadata
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        name:
          type: string
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        is_holiday:
          type: boolean
        can_everyone_view:
          type: boolean
        note:
          nullable: true
          type: string
        metadata:
          type: object

    CalendarBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateCalendarRequest:
      type: object
      required:
        - company_id
        - name
        - date_start
        - date_end
        - is_holiday
        - can_everyone_view
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        is_holiday:
          type: boolean
        can_everyone_view:
          type: boolean
        note:
          nullable: true
          type: string
        metadata:
          type: object

    UpdateCalendarRequest:
      type: object
      required:
        - company_id
        - name
        - date_start
        - date_end
        - is_holiday
        - can_everyone_view
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        is_holiday:
          type: boolean
        can_everyone_view:
          type: boolean
        note:
          nullable: true
          type: string
        metadata:
          type: object

    PatchCalendarRequest:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        is_holiday:
          type: boolean
        can_everyone_view:
          type: boolean
        note:
          nullable: true
          type: string
        metadata:
          type: object

    CalendarList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CalendarBranch:
      type: object
      required:
        - id
        - calendar_id
        - company_id
        - branch_id
        - metadata
      properties:
        id:
          type: string
          format: uuid
        calendar_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
